[project]
name = "facevec-attend"
version = "0.1.0"
description = "Face recognition attendance system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
    "opencv-python>=4.8.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.9.0",
    "insightface>=0.7.3",
    "python-dotenv>=1.0.0",
    "plotly>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:launch_testing -p no:launch_ros"  # ponytail: block ROS pytest plugins leaking via PYTHONPATH
